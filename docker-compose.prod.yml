services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: smartcareer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartcareer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_strong_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartcareer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. NestJS Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: smartcareer_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-change_this_strong_password}@postgres:5432/${POSTGRES_DB:-smartcareer}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_EVALUATOR_MODEL: ${AI_EVALUATOR_MODEL:-}
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL:-}
      JUDGE0_API_URL: ${JUDGE0_API_URL:-https://judge0-ce.p.rapidapi.com}
      JUDGE0_AUTH_HEADER: ${JUDGE0_AUTH_HEADER:-X-RapidAPI-Key}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      JSEARCH_API_URL: ${JSEARCH_API_URL:-https://jsearch.p.rapidapi.com}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      UDEMY_CLIENT_ID: ${UDEMY_CLIENT_ID:-}
      UDEMY_CLIENT_SECRET: ${UDEMY_CLIENT_SECRET:-}
      INGESTION_CONFIG_DIR: /app/apps/api/config
    volumes:
      - api_config:/app/apps/api/config
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 3. Next.js Frontend Web
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SHOW_DEMO_LOGIN: "false"
    container_name: smartcareer_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SHOW_DEMO_LOGIN: "false"
    ports:
      - "127.0.0.1:3000:3000"

  # 4. Caddy Reverse Proxy & Automatic HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: smartcareer_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  api_config:
  postgres_data:
  caddy_data:
  caddy_config:
