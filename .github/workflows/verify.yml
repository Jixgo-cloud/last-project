name: Verify SmartCareer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartcareer
          POSTGRES_PASSWORD: local-ci-password
          POSTGRES_DB: smartcareer_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://smartcareer:local-ci-password@localhost:5432/smartcareer_ci
      JWT_SECRET: isolated-ci-signing-key-with-at-least-32-characters
      JWT_EXPIRES_IN: 5m
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run lint
      - run: npm run test:security
      - name: Initialize empty local source database
        run: npx prisma db push --skip-generate
      - run: npm run test:regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-evidence
          path: output/core-regression/
          retention-days: 7
